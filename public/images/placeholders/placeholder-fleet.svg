<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="fleetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#fleetBg)" />
  <rect x="16" y="16" width="568" height="368" rx="16" fill="#ffffff" stroke="#eef1f6" stroke-width="2" />

  <!-- Road Horizon -->
  <line x1="60" y1="260" x2="540" y2="260" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
  <line x1="220" y1="260" x2="280" y2="260" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  <line x1="320" y1="260" x2="380" y2="260" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>

  <!-- Bike Silhouette -->
  <g transform="translate(300, 160) scale(1)">
    <!-- Back Wheel -->
    <circle cx="-65" cy="50" r="30" fill="#002244" stroke="#eef1f6" stroke-width="5"/>
    <circle cx="-65" cy="50" r="15" fill="#FFC107"/>
    <circle cx="-65" cy="50" r="5" fill="#002244"/>

    <!-- Front Wheel -->
    <circle cx="65" cy="50" r="30" fill="#002244" stroke="#eef1f6" stroke-width="5"/>
    <circle cx="65" cy="50" r="15" fill="#FFC107"/>
    <circle cx="65" cy="50" r="5" fill="#002244"/>

    <!-- Frame -->
    <path d="M -65 50 L -38 12 L 0 12 L 30 42 L 65 50" fill="none" stroke="#003366" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -35 42 L 18 42" stroke="#002244" stroke-width="7" stroke-linecap="round"/>
    <path d="M -55 8 Q -35 -8 0 4 L -8 18 Z" fill="#002244"/>
    <path d="M 18 42 L 48 -20 L 36 -32" fill="none" stroke="#003366" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 28 -32 L 46 -32" stroke="#002244" stroke-width="5" stroke-linecap="round"/>
    <circle cx="50" cy="-20" r="5" fill="#FFC107"/>
  </g>

  <!-- Tag & Labels -->
  <rect x="200" y="32" width="200" height="24" rx="12" fill="#003366" />
  <text x="300" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1.2" text-anchor="middle">FLEET MODEL PREVIEW</text>

  <text x="300" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#002244" text-anchor="middle">GK WhizWheel Rental Fleet</text>
  <text x="300" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#555555" text-anchor="middle">Commercial Yellow Plates • Sanitized Handover</text>
  
  <text x="300" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FFC107" letter-spacing="1" text-anchor="middle">VEHICLE PHOTO PENDING UPLOAD</text>
</svg>
