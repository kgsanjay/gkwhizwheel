<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="boatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#e0effe" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#boatBg)" />
  <rect x="24" y="24" width="752" height="452" rx="20" fill="#ffffff" stroke="#eef1f6" stroke-width="2" />

  <!-- Estuary Water Waves -->
  <path d="M 60 280 Q 200 260 340 280 T 620 280 T 740 280" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <path d="M 90 305 Q 230 285 370 305 T 650 305 T 710 305" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 120 330 Q 260 310 400 330 T 680 330" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>

  <!-- Boat Vector Illustration -->
  <g transform="translate(400, 195) scale(1.15)">
    <!-- Boat Hull -->
    <path d="M -85 35 L 75 35 L 95 10 L -65 10 Z" fill="#003366" stroke="#002244" stroke-width="3"/>
    <!-- Hull Stripe -->
    <path d="M -78 26 L 81 26 L 87 18 L -72 18 Z" fill="#FFC107" />
    <!-- Cabin Structure -->
    <path d="M -45 10 L 35 10 L 25 -25 L -35 -25 Z" fill="#f8f9fa" stroke="#002244" stroke-width="2"/>
    <!-- Windows -->
    <rect x="-28" y="-18" width="16" height="12" rx="3" fill="#0284c7"/>
    <rect x="-3" y="-18" width="16" height="12" rx="3" fill="#0284c7"/>
    <!-- Canopy Pole & Roof -->
    <line x1="-50" y1="10" x2="-50" y2="-40" stroke="#002244" stroke-width="3"/>
    <line x1="45" y1="10" x2="45" y2="-40" stroke="#002244" stroke-width="3"/>
    <path d="M -58 -40 Q 0 -50 55 -40" fill="none" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
    <!-- Flag -->
    <polygon points="50,-35 65,-30 50,-25" fill="#FFC107"/>
  </g>

  <!-- Tag & Labels -->
  <rect x="270" y="44" width="260" height="28" rx="14" fill="#003366" />
  <text x="400" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">SHARAVATHI ESTUARY BOATING</text>

  <text x="400" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#002244" text-anchor="middle">Sharavathi Mangrove Cruise</text>
  <text x="400" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#555555" text-anchor="middle">Island Hopping • Sunset Slots • Licensed Captain &amp; Life Jackets</text>
  
  <text x="400" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0284c7" letter-spacing="1" text-anchor="middle">IMAGE PREVIEW • EXPERIENCE PHOTO PENDING</text>
</svg>
