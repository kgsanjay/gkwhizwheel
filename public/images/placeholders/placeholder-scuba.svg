<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="scubaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#scubaBg)" />
  <rect x="24" y="24" width="752" height="452" rx="20" fill="#ffffff" stroke="#eef1f6" stroke-width="2" />

  <!-- Underwater Bubbles & Corals -->
  <circle cx="140" cy="220" r="12" fill="none" stroke="#38bdf8" stroke-width="2" />
  <circle cx="160" cy="180" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="660" cy="240" r="14" fill="none" stroke="#38bdf8" stroke-width="2" />
  <circle cx="640" cy="190" r="9" fill="none" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Scuba Mask & Snorkel Vector Illustration -->
  <g transform="translate(400, 190) scale(1.15)">
    <!-- Mask Frame -->
    <path d="M -50 -10 Q 0 -25 50 -10 Q 55 20 25 35 Q 0 25 -25 35 Q -55 20 -50 -10 Z" fill="#003366" stroke="#002244" stroke-width="4"/>
    <!-- Glass Lenses -->
    <ellipse cx="-22" cy="5" rx="18" ry="16" fill="#38bdf8" fill-opacity="0.8"/>
    <ellipse cx="22" cy="5" rx="18" ry="16" fill="#38bdf8" fill-opacity="0.8"/>
    <!-- Glass Highlights -->
    <path d="M -30 -2 L -18 -8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 14 -2 L 26 -8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Nose Pocket -->
    <path d="M -8 18 Q 0 32 8 18 Z" fill="#FFC107" stroke="#002244" stroke-width="2"/>
    <!-- Snorkel Tube -->
    <path d="M 52 10 Q 75 10 75 -25 L 75 -65 Q 85 -75 92 -65" fill="none" stroke="#FFC107" stroke-width="7" stroke-linecap="round"/>
    <!-- Snorkel Mouthpiece Clip -->
    <rect x="48" y="5" width="8" height="10" rx="2" fill="#002244"/>
    <!-- Mask Strap -->
    <path d="M -50 0 L -80 0" stroke="#002244" stroke-width="5" stroke-linecap="round"/>
    <path d="M 50 0 L 80 0" stroke="#002244" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Tag & Labels -->
  <rect x="270" y="44" width="260" height="28" rx="14" fill="#0284c7" />
  <text x="400" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">NETRANI SCUBA &amp; SNORKELING</text>

  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#002244" text-anchor="middle">Netrani Island Diving</text>
  <text x="400" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#555555" text-anchor="middle">1:1 PADI Master • Underwater 4K Video • Non-Swimmer Friendly</text>
  
  <text x="400" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0284c7" letter-spacing="1" text-anchor="middle">IMAGE PREVIEW • SCUBA MEDIA PENDING</text>
</svg>
