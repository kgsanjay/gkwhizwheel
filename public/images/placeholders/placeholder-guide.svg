<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="guideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="100%" stop-color="#eef1f6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#guideBg)" />
  <rect x="24" y="24" width="752" height="452" rx="20" fill="#ffffff" stroke="#eef1f6" stroke-width="2" />

  <!-- Compass / Guide Map Vector Illustration -->
  <g transform="translate(400, 190) scale(1.15)">
    <!-- Map Fold Lines Background -->
    <polygon points="-70,40 -20,50 20,40 70,50 70,-40 20,-50 -20,-40 -70,-50" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="-20" y1="-40" x2="-20" y2="50" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="20" y1="-50" x2="20" y2="40" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Compass Dial -->
    <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#003366" stroke-width="4"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#FFC107" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Compass Rose -->
    <polygon points="0,-28 7,0 0,6 -7,0" fill="#003366"/>
    <polygon points="0,28 7,0 0,-6 -7,0" fill="#FFC107"/>
    <polygon points="-28,0 0,-7 6,0 0,7" fill="#002244"/>
    <polygon points="28,0 0,-7 -6,0 0,7" fill="#002244"/>
    
    <circle cx="0" cy="0" r="4" fill="#002244"/>
    
    <!-- Cardinal Letters -->
    <text x="0" y="-18" font-family="-apple-system, sans-serif" font-size="7" font-weight="900" fill="#003366" text-anchor="middle">N</text>
  </g>

  <!-- Tag & Labels -->
  <rect x="270" y="44" width="260" height="28" rx="14" fill="#003366" />
  <text x="400" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">CERTIFIED LOCAL GUIDES</text>

  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#002244" text-anchor="middle">Certified Local Tour Guides</text>
  <text x="400" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#555555" text-anchor="middle">Kannada • English • Hindi • Heritage Stories &amp; Hidden Waterfalls</text>
  
  <text x="400" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFC107" letter-spacing="1" text-anchor="middle">IMAGE PREVIEW • GUIDE PHOTO PENDING</text>
</svg>
