<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cabBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="100%" stop-color="#eef1f6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#cabBg)" />
  <rect x="24" y="24" width="752" height="452" rx="20" fill="#ffffff" stroke="#eef1f6" stroke-width="2" />

  <!-- Road Horizon Line -->
  <line x1="80" y1="310" x2="720" y2="310" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
  <line x1="280" y1="310" x2="360" y2="310" stroke="#FFC107" stroke-width="3" stroke-linecap="round" />
  <line x1="440" y1="310" x2="520" y2="310" stroke="#FFC107" stroke-width="3" stroke-linecap="round" />

  <!-- Car / Cab Vector Illustration -->
  <g transform="translate(400, 200) scale(1.15)">
    <!-- Rear & Front Wheels -->
    <circle cx="-65" cy="50" r="26" fill="#002244" stroke="#eef1f6" stroke-width="5"/>
    <circle cx="-65" cy="50" r="14" fill="#FFC107"/>
    <circle cx="-65" cy="50" r="5" fill="#002244"/>

    <circle cx="65" cy="50" r="26" fill="#002244" stroke="#eef1f6" stroke-width="5"/>
    <circle cx="65" cy="50" r="14" fill="#FFC107"/>
    <circle cx="65" cy="50" r="5" fill="#002244"/>

    <!-- Car Body -->
    <path d="M -100 45 L -95 15 L -60 10 L -30 -25 L 30 -25 L 65 10 L 100 15 L 105 45 Z" fill="#003366" stroke="#002244" stroke-width="3"/>
    <!-- Yellow Taxi Roof Light -->
    <rect x="-16" y="-36" width="32" height="11" rx="4" fill="#FFC107" stroke="#002244" stroke-width="2"/>
    <text x="0" y="-28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="900" fill="#002244" text-anchor="middle">TAXI</text>
    <!-- Windows -->
    <path d="M -25 -20 L 25 -20 L 52 8 L -25 8 Z" fill="#38bdf8" fill-opacity="0.8"/>
    <line x1="0" y1="-20" x2="0" y2="8" stroke="#003366" stroke-width="3"/>
    <!-- Headlights & Taillights -->
    <rect x="98" y="20" width="8" height="8" rx="2" fill="#FFC107"/>
    <rect x="-104" y="20" width="6" height="8" rx="2" fill="#ef4444"/>
  </g>

  <!-- Tag & Labels -->
  <rect x="280" y="44" width="240" height="28" rx="14" fill="#003366" />
  <text x="400" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">CHAUFFEURED TRANSIT</text>

  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#002244" text-anchor="middle">Chauffeured Coastal AC Cabs</text>
  <text x="400" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#555555" text-anchor="middle">Sedan • Ertiga 7-Seater • Tempo Traveller • Zero Surge Rates</text>
  
  <text x="400" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFC107" letter-spacing="1" text-anchor="middle">IMAGE PREVIEW • VEHICLE PHOTO PENDING</text>
</svg>
