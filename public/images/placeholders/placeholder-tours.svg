<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="tourBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="100%" stop-color="#eef1f6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#tourBg)" />
  <rect x="24" y="24" width="752" height="452" rx="20" fill="#ffffff" stroke="#eef1f6" stroke-width="2" />

  <!-- Road Trip / Coastal Trail Vector Illustration -->
  <g transform="translate(400, 190) scale(1.15)">
    <!-- Scenic Mountain Backdrop -->
    <polygon points="-80,50 -20,-20 30,50" fill="#cbd5e1"/>
    <polygon points="0,50 50,-10 90,50" fill="#e2e8f0"/>
    <polygon points="-50,50 -10,-40 40,50" fill="#94a3b8"/>
    <!-- Snow peak -->
    <polygon points="-10,-40 -20,-25 0,-25" fill="#ffffff"/>

    <!-- Winding Coastal Route -->
    <path d="M -90 50 Q -30 20 0 40 T 90 20" fill="none" stroke="#FFC107" stroke-width="8" stroke-linecap="round"/>
    <path d="M -90 50 Q -30 20 0 40 T 90 20" fill="none" stroke="#003366" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>

    <!-- Pin Marker -->
    <circle cx="50" cy="10" r="14" fill="#003366" stroke="#ffffff" stroke-width="2"/>
    <circle cx="50" cy="10" r="6" fill="#FFC107"/>
  </g>

  <!-- Tag & Labels -->
  <rect x="270" y="44" width="260" height="28" rx="14" fill="#003366" />
  <text x="400" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">CURATED COASTAL PACKAGES</text>

  <text x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#002244" text-anchor="middle">Custom Coastal Tour Packages</text>
  <text x="400" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#555555" text-anchor="middle">All-Inclusive Vehicles, Boat Safaris, Scuba Dives &amp; Stays</text>
  
  <text x="400" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFC107" letter-spacing="1" text-anchor="middle">IMAGE PREVIEW • TOUR MEDIA PENDING</text>
</svg>
