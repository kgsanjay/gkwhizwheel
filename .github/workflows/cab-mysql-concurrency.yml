name: Cab MySQL Concurrency

on:
  push:
    branches:
      - "feat/issue-56-cab-cancellation-audit-20261108"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  mysql-cab-allocator-race:
    name: Cab allocation concurrency (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: gkw_cab_race_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      CAB_REQUIRE_MYSQL_RACE: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: gkw_cab_race_ci
      DB_USERNAME: root
      DB_PASSWORD: test_root_password
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP with MySQL and process isolation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pcntl, posix
          coverage: none
      - name: Install dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Create test application environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Assert real MySQL and pcntl are active
        run: |
          php -r 'if (!extension_loaded("pdo_mysql") || !function_exists("pcntl_fork")) exit(1);'
          php artisan tinker --execute='if (DB::getDriverName() !== "mysql") throw new Exception("MySQL connection was not selected");'
      - name: Verify existing and partial resource migration safety on disposable MySQL
        env:
          RESOURCE_SCHEMA_RECOVERY_TESTS: '1'
        run: php artisan test tests/Integration/ServiceResourceMySqlRecoveryTest.php --stop-on-failure
      - name: Verify atomic unpaid offline approval on MySQL
        run: |
          php artisan test tests/Feature/ServiceBookingApprovalTest.php --stop-on-failure
          php artisan test tests/Feature/CabDispatchFlowTest.php --filter='cab approval' --stop-on-failure
          php artisan test tests/Feature/ServiceApprovalMySqlConcurrencyTest.php --stop-on-failure
      - name: Verify service quote and payment allocation gates on MySQL
        run: |
          php artisan test tests/Feature/ServiceQuoteSnapshotTest.php --stop-on-failure
          php artisan test tests/Feature/ServicePaymentEligibilityTest.php --stop-on-failure
      - name: Verify private document boundaries on MySQL
        run: |
          php artisan test tests/Feature/DocumentDownloadAuthorizationTest.php --stop-on-failure
          php artisan test tests/Feature/AdminServiceItemDocumentsTest.php --stop-on-failure
      - name: Verify cancellation recording failures roll back on MySQL
        run: php artisan test tests/Feature/CabDispatchFlowTest.php --filter='cancellation rolls back paired resources' --stop-on-failure
      - name: Verify concurrent service hold idempotency on MySQL
        run: |
          set -euo pipefail
          for attempt in {1..3}; do
            echo "Service hold race repetition ${attempt}/3"
            php artisan test tests/Feature/ServiceHoldMySqlConcurrencyTest.php --stop-on-failure
          done
      - name: Repeat isolated cross-process races ten times
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            echo "MySQL race repetition ${attempt}/10"
            php artisan test tests/Feature/CabMySqlConcurrencyTest.php --stop-on-failure
          done
