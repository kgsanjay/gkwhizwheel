name: Build original React homepage for branch-based GitHub Pages
on:
  push:
    branches: [ui-preview]
    paths:
      - 'preview-src/**'
      - 'preview-vite.config.js'
      - 'resources/js/Pages/Welcome.jsx'
      - 'resources/js/Layouts/AppLayout.jsx'
      - 'resources/js/Components/**'
      - 'resources/js/theme/**'
      - 'resources/css/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/preview-original-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vite build --config preview-vite.config.js
      - name: Publish built React files to GitHub Pages branch root
        run: |
          cp preview-dist/preview-src/template.html index.html
          rm -rf preview-bundle
          cp -R preview-dist/preview-bundle preview-bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html preview-bundle
          if ! git diff --cached --quiet; then
            git commit -m "build(preview): publish exact original React homepage [skip ci]"
            git push
          fi
