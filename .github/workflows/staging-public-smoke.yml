name: Staging Public Smoke Test

on:
  push:
    branches:
      - test/staging-public-smoke-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-read-only:
    name: External Staging HTTP Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only public pages, APIs and access control
        env:
          STAGING_BASE_URL: https://staging.whizwheels.in
        run: python3 scripts/staging_public_smoke.py

  staging-browser:
    name: Desktop and Mobile Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python3 -m pip install --user playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Render live staging pages on desktop and mobile
        env:
          STAGING_BASE_URL: https://staging.whizwheels.in
        run: python3 scripts/staging_browser_smoke.py
      - name: Upload screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-screenshots
          path: artifacts/staging-browser/
          if-no-files-found: ignore
