name: UI Preview CI

on:
  push:
    branches: [ui-preview]
    paths:
      - 'preview-src/**'
      - 'preview-vite.config.js'
      - 'resources/js/**'
      - 'resources/css/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ui-preview]

permissions:
  contents: read

jobs:
  static-ui:
    name: Static website preview build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Validate GitHub Pages React UI
        run: npx vite build --config preview-vite.config.js
      - name: Verify static entry and assets
        run: |
          test -f preview-dist/preview-src/template.html
          test -d preview-dist/preview-bundle
